services:
  clickhouse:
    image: clickhouse/clickhouse-server:26.7
    container_name: text2sql-clickhouse
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-text2sql}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-text2sql}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-text2sql}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ports:
      - "${CLICKHOUSE_HTTP_PORT:-8123}:8123"   # HTTP — его использует MCP-сервер
      - "${CLICKHOUSE_NATIVE_PORT:-9000}:9000" # native protocol
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 20s
    restart: unless-stopped

volumes:
  clickhouse-data:
